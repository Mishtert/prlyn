[project]
name = "prlyn"
version = "0.1.0"
description = "A powerful, extensible tool for analyzing LLM prompts."
readme = "README.md"
authors = [
    { name = "prlyn Contributors" },
]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=0.1.0",
    "mcp>=0.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "spacy>=3.7.0",
    "structlog>=25.5.0",
    "tiktoken>=0.7.0",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.urls]
Homepage = "https://github.com/mthangaraj/prlyn"
Repository = "https://github.com/mthangaraj/prlyn"

[project.scripts]
prlyn = "prlyn.server:run"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
